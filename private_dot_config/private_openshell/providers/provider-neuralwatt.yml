id: neuralwatt
display_name: NeuralWatt
description: Direct NeuralWatt inference access
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: NeuralWatt API key
    env_vars:
      - NEURALWATT_API_KEY
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials:
    - api_key

endpoints:
  - host: api.neuralwatt.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/node
  - /usr/local/bin/hax
